name: Build and publish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The ghcr.io package was originally created with a PAT, so GITHUB_TOKEN
          # cannot push to it unless the package grants this repo write access.
          password: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nikosdelis/azure-dns-updater:latest

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: >
          dotnet publish src/azure-dns-updater.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -o publish/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: azure-dns-updater-win-x64
          path: publish/win-x64
